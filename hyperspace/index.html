<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Hour — Hyperspace Landing Experiment</title>
<style>
  :root{
    --navy:#0b1c30; --navy2:#103d60; --gold:#d9a94a; --cream:#f7f1e3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--navy)}
  body{
    font-family: Georgia, 'Times New Roman', serif; color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% 110%, rgba(217,169,74,.28), transparent 55%),
      radial-gradient(140% 100% at 50% 0%, #16395e 0%, var(--navy2) 34%, #0a1626 78%, #060d18 100%);
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  .card{
    position:absolute;left:0;top:0;width:26vmin;height:34vmin;
    border-radius:1.2vmin;overflow:hidden;will-change:transform,filter,opacity;
    background:#12283f center/cover;
    box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.55), 0 0 0 1px rgba(247,241,227,.14);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(60% 60% at 50% 50%, rgba(217,169,74,.55), transparent 70%)}

  /* ---- settled hero ---- */
  #hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:0 8vw;opacity:0;pointer-events:none;
    transition:opacity 1.1s ease .15s}
  #hero.on{opacity:1;pointer-events:auto}
  .kicker{font-family:Verdana,Geneva,sans-serif;font-size:3.4vmin;letter-spacing:.55em;
    text-indent:.55em;color:rgba(247,241,227,.85);margin-bottom:3.5vh}
  h1{font-weight:400;font-size:17vmin;line-height:1.02;letter-spacing:.01em;
    text-shadow:0 2px 30px rgba(0,0,0,.4)}
  .rule{width:26vmin;height:2px;background:var(--gold);margin:3.2vh auto;opacity:.9}
  .tag{font-style:italic;font-size:5.4vmin;line-height:1.5;color:rgba(247,241,227,.92);max-width:80vw}
  .cta{margin-top:4.5vh;font-family:Verdana,Geneva,sans-serif;font-size:3.6vmin;letter-spacing:.35em;
    text-indent:.35em;color:var(--cream);border:1px solid var(--gold);padding:2.4vh 9vw;
    background:rgba(217,169,74,.06)}
  .scroll{position:absolute;bottom:19vh;font-family:Verdana,sans-serif;font-size:3vmin;
    letter-spacing:.5em;text-indent:.5em;color:rgba(247,241,227,.6)}
  .scroll::after{content:"";display:block;width:3vmin;height:3vmin;margin:1.4vh auto 0;
    border-right:1px solid rgba(247,241,227,.6);border-bottom:1px solid rgba(247,241,227,.6);
    transform:rotate(45deg)}

  /* ---- settled filmstrip marquee ---- */
  #strip{position:fixed;left:0;right:0;bottom:0;height:15vh;overflow:hidden;opacity:0;
    transition:opacity 1s ease .5s;pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  #strip.on{opacity:.9}
  #strip .track{display:flex;gap:2.5vmin;height:100%;width:max-content;align-items:center;
    animation:roll 40s linear infinite}
  #strip img{height:11.5vh;width:auto;border-radius:1vmin;object-fit:cover;
    box-shadow:0 1vh 3vh rgba(0,0,0,.5)}
  @keyframes roll{to{transform:translateX(-50%)}}

  #replay{position:fixed;right:5vw;bottom:17.5vh;z-index:5;display:none;
    font-family:Verdana,sans-serif;font-size:2.8vmin;letter-spacing:.3em;text-indent:.3em;
    color:rgba(247,241,227,.75);border:1px solid rgba(247,241,227,.35);border-radius:99px;
    padding:1.4vh 5vw;background:rgba(11,28,48,.55);cursor:pointer}
  #replay.on{display:block}
  #hint{position:fixed;top:3.2vh;width:100%;text-align:center;z-index:5;
    font-family:Verdana,sans-serif;font-size:2.6vmin;letter-spacing:.4em;text-indent:.4em;
    color:rgba(247,241,227,.45)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="hint">TAP TO SKIP</div>

<section id="hero" aria-label="The Golden Hour">
  <div class="kicker">FROM ASPEN AND BEYOND</div>
  <h1>The Golden<br>Hour</h1>
  <div class="rule"></div>
  <p class="tag">A weekly field guide to what's on — music, art, and high-country happenings, verified before publication.</p>
  <div class="cta">SEE WHAT'S ON</div>
  <div class="scroll">SCROLL</div>
</section>

<div id="strip" aria-hidden="true"><div class="track" id="track"></div></div>
<button id="replay">↻ REPLAY</button>

<script>
const PHOTOS = [{"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-art-museum.jpg", "title": "Aspen Art Museum \u2014 Fall Exhibitions"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-filmfest-isis-theatre.jpg", "title": "Aspen Filmfest \u2014 Opening Day (47th)"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/michigander-live-concert.jpg", "title": "Michigander at Belly Up"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/john-denver-celebration-aspen.webp", "title": "John Denver Celebration \u2014 Opening Day"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/tom-rush-folk-singer.jpg", "title": "An Evening with Tom Rush accompanied by Brendan Cleary"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/pink-talking-fish-live-concert.webp", "title": "An Evening with Pink Talking Fish"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/mack-bailey-chris-nole-john-denver.webp", "title": "Mack Bailey and Chris Nole: Poems, Prayers & Promises: The Songs of John Denver"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-saturday-market.jpg", "title": "Aspen Saturday Market \u2014 Season Finale"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/carbondale-potato-day-parade.jpg", "title": "Carbondale Potato Day"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-filmfest.jpg", "title": "Aspen Filmfest \u2014 Closing Weekend"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/kiliii-yuyan-photographer.jpg", "title": "Changemaker Speaker Series Kiliii Yuyan: Indigenous Wisdom for a Modern World"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/manual-cinema-4th-witch.jpg", "title": "Manual Cinema's The 4th Witch"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/vienna-boys-choir.jpg", "title": "Vienna Boys Choir"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/metalachi-live-concert.jpg", "title": "Metalachi"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/digable-planets-live-concert.jpg", "title": "Digable Planets"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/the-black-angels-live-concert.webp", "title": "The Black Angels with GHOSTWOMAN"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/foy-vance-singer.jpg", "title": "Foy Vance World Tour with Bonnie Bishop & Ryan McMullan"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/bonobo-live-concert.jpg", "title": "Bonobo"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/suzy-bogguss-singer.webp", "title": "Suzy Bogguss: A Swingin' Little Christmas"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/the-wooten-brothers.webp", "title": "The Wooten Brothers"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/eddie-ifft-comedian.jpg", "title": "EDDiE iFFT: The Last Chair Tour"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/ismo-comedian.jpg", "title": "Ismo: Perseverance Tour"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/danceaspen-snowy-soiree.webp", "title": "DanceAspen: A Snowy Soiree"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/john-oates-good-road-band.jpg", "title": "John Oates and the Good Road Band"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/lcd-soundsystem-live-concert.jpg", "title": "LCD Soundsystem \u2014 New Year's Eve 2026"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/lcd-soundsystem-new-year-s-eve-concert.jpg", "title": "LCD Soundsystem \u2014 New Year's Eve 2026"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/hot-air-balloons-snowmass-town-park.jpg", "title": "Snowmass Balloon Festival \u2014 Final Launch"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-literary-festival.png", "title": "Aspen Literary Festival \u2014 Closing Day"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/aspen-restaurant-fine-dining.jpg", "title": "Aspen Restaurant Week Autumn \u2014 Final Evening"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/bombargo-live-concert.jpg", "title": "Bombargo at Belly Up"}, {"src": "https://ron-delhaye-studios.github.io/this-week-in-aspen/calendar/assets/browse/maroon-bells-fall-colors.jpg", "title": "Maroon Bells at Peak Color"}];
const N = 12;
const picks = PHOTOS.slice(0, N);
const stage = document.getElementById('stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let skipped = false, finished = false;

/* ---------- tiny tween engine ---------- */
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function tween(dur, ease, fn){
  return new Promise(res => {
    const t0 = performance.now();
    (function frame(t){
      if (skipped) return res();
      const p = Math.min(1, (t - t0) / dur);
      fn(ease(p));
      p < 1 ? requestAnimationFrame(frame) : res();
    })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- cards ---------- */
const cards = picks.map((p, i) => {
  const d = document.createElement('div');
  d.className = 'card';
  const img = document.createElement('img');
  img.src = p.src; img.alt = p.title; img.loading = 'eager';
  img.onerror = () => d.style.background = 'linear-gradient(135deg,#16395e,#0b1c30)';
  d.appendChild(img);
  stage.appendChild(d);
  return { el: d, img, title: p.title,
    x: 0, y: 0, r: 0, s: 1, o: 1, blur: 0 };
});
const W = () => innerWidth, H = () => innerHeight;
function render(c){
  c.el.style.transform =
    `translate(${c.x * W() / 100}px, ${c.y * H() / 100}px) rotate(${c.r}deg) scale(${c.s})`;
  c.el.style.opacity = c.o;
  c.el.style.filter = c.blur > .05 ? `blur(${c.blur}px)` : '';
}
/* anchor cards by center: offset half size in px via translate + margin trick */
cards.forEach(c => {
  c.el.style.marginLeft = '-13vmin'; c.el.style.marginTop = '-17vmin';
});
const rnd = (a, b) => a + Math.random() * (b - a);
const edgeStart = () => {
  const e = Math.floor(rnd(0, 4));
  return [
    { x: rnd(-30, 130), y: -30 }, { x: rnd(-30, 130), y: 130 },
    { x: -30, y: rnd(-30, 130) }, { x: 130, y: rnd(-30, 130) }
  ][e];
};

/* ---------- acts ---------- */
async function actHyperspace(){
  const jobs = cards.map((c, i) => (async () => {
    const s = edgeStart();
    Object.assign(c, { x: s.x, y: s.y, r: rnd(-40, 40), s: rnd(.8, 1.2), o: 1, blur: 6 });
    render(c);
    await wait(i * 70);
    const tx = rnd(8, 84), ty = rnd(8, 80), tr = rnd(-22, 22), ts = rnd(.75, 1.15);
    const fx = c.x, fy = c.y, fr = c.r, fs = c.s;
    await tween(1300, easeOutCubic, e => {
      Object.assign(c, { x: fx + (tx - fx) * e, y: fy + (ty - fy) * e,
        r: fr + (tr - fr) * e, s: fs + (ts - fs) * e, blur: 6 * (1 - e) });
      render(c);
    });
  })());
  await Promise.all(jobs);
}

async function actUnify(){
  await wait(450);
  const jobs = cards.map((c, i) => (async () => {
    const col = i % 4, row = Math.floor(i / 4);
    const tx = 50 + (col - 1.5) * 24, ty = 46 + (row - 1) * 26;
    const fx = c.x, fy = c.y, fr = c.r, fs = c.s;
    await wait(i * 45);
    await tween(1400, easeInOutCubic, e => {
      Object.assign(c, { x: fx + (tx - fx) * e, y: fy + (ty - fy) * e,
        r: fr * (1 - e), s: fs + (.92 - fs) * e });
      render(c);
    });
  })());
  await Promise.all(jobs);
  /* the unified pulse */
  const flash = document.getElementById('flash');
  flash.style.transition = 'none'; flash.style.opacity = .9;
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity .8s ease'; flash.style.opacity = 0;
  });
  await tween(500, easeOutCubic, e => {
    const s = 1 + Math.sin(e * Math.PI) * .05;
    cards.forEach(c => { c.s = .92 * s; render(c); });
  });
  await wait(500);
}

async function actSettle(){
  const jobs = cards.map((c, i) => (async () => {
    const fx = c.x, fy = c.y, fs = c.s;
    const tx = 6 + i * 8.2, ty = 92;
    await wait(i * 35);
    await tween(1500, easeInOutCubic, e => {
      Object.assign(c, { x: fx + (tx - fx) * e, y: fy + (ty - fy) * e,
        s: fs + (.42 - fs) * e, r: 0 });
      render(c);
    });
  })());
  await Promise.all(jobs);
  /* hand off to the infinite marquee + hero */
  const track = document.getElementById('track');
  const seq = picks.map(p => {
    const im = document.createElement('img'); im.src = p.src; im.alt = p.title;
    return im;
  });
  seq.concat(seq.map(im => im.cloneNode())).forEach(im => track.appendChild(im));
  cards.forEach(c => { c.o = 0; render(c); });
  await wait(120);
  cards.forEach(c => c.el.remove());
  document.getElementById('strip').classList.add('on');
  document.getElementById('hero').classList.add('on');
  document.getElementById('hint').style.display = 'none';
  document.getElementById('replay').classList.add('on');
  finished = true;
}

function settleInstant(){
  const track = document.getElementById('track');
  picks.forEach(p => {
    const im = document.createElement('img'); im.src = p.src; im.alt = p.title;
    track.appendChild(im);
  });
  [...track.children].forEach(im => track.appendChild(im.cloneNode()));
  document.getElementById('strip').classList.add('on');
  document.getElementById('hero').classList.add('on');
  document.getElementById('hint').style.display = 'none';
  finished = true;
}

async function run(){
  if (reduced) return settleInstant();
  try {
    await actHyperspace();
    if (!skipped) await actUnify();
    if (!skipped) await actSettle();
    else settleInstant();
  } catch(e){ settleInstant(); }
}

addEventListener('pointerdown', () => {
  if (!finished && !skipped){ skipped = true; }
}, { once:false });
document.getElementById('replay').addEventListener('click', ev => {
  ev.stopPropagation();
  location.reload();
});

/* preload, then go */
Promise.allSettled(picks.map(p => new Promise(res => {
  const im = new Image(); im.onload = im.onerror = res; im.src = p.src;
  setTimeout(res, 2500);
}))).then(() => setTimeout(run, 350));
</script>
</body>
</html>
